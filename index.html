<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- OpenGraph Metadata -->
    <title>MLBB Fake Enemy Chat Generator</title>
    <meta name="description" content="Buat chat palsu seolah-olah musuh yang berbicara di Mobile Legends. Gunakan untuk seru-seruan dengan teman!">
    <meta property="og:title" content="MLBB Fake Chat Generator">
    <meta property="og:description" content="Prank musuh atau temanmu dengan generator chat Mobile Legends ini.">
    <meta property="og:image" content="https://via.placeholder.com/1200x630.png?text=MLBB+Chat+Generator">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .ml-card { background-color: #1e293b; border: 1px solid #334155; }
        .ml-input { background-color: #0f172a; border: 1px solid #475569; color: white; padding-right: 2.5rem; }
        .ml-input:focus { border-color: #3b82f6; outline: none; }
        .ml-btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); transition: 0.3s; }
        .ml-btn:hover { background: linear-gradient(135deg, #3b82f6, #2563eb); transform: translateY(-1px); }
        .clear-btn { color: #94a3b8; transition: 0.2s; cursor: pointer; }
        .clear-btn:hover { color: #ef4444; }
        
        .result-box { 
            background-color: #020617; 
            border-left: 4px solid #ef4444; 
            white-space: pre; 
            overflow-x: auto;
            font-family: ui-monospace, monospace;
        }
        .result-box::-webkit-scrollbar { height: 4px; }
        .result-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full ml-card rounded-xl p-6 shadow-2xl">
        
        <!-- Language Switcher -->
        <div class="flex justify-end mb-4 space-x-2">
            <button onclick="changeLanguage('id')" class="text-xs px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 font-semibold uppercase">ID</button>
            <button onclick="changeLanguage('en')" class="text-xs px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 font-semibold uppercase">EN</button>
        </div>

        <h1 class="text-3xl font-bold text-center mb-1 text-blue-400 italic">MLBB FAKE CHAT</h1>
        <p id="sub-title" class="text-center text-sm text-slate-400 mb-8">Generator chat palsu untuk prank musuh</p>

        <!-- Input Fields -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
            <!-- Prefix -->
            <div class="relative">
                <label id="lbl-prefix" class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1"></label>
                <div class="relative">
                    <input type="text" id="prefix" value="" placeholder="Default: p" class="w-full p-2.5 rounded ml-input text-sm">
                    <button onclick="clearField('prefix')" class="absolute right-2 top-1/2 -translate-y-1/2 clear-btn px-2 text-lg">&times;</button>
                </div>
            </div>
            <!-- Nickname -->
            <div class="relative">
                <label id="lbl-nick" class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1"></label>
                <div class="relative">
                    <input type="text" id="nick" value="" placeholder="Default: nickmusuh" class="w-full p-2.5 rounded ml-input text-sm">
                    <button onclick="clearField('nick')" class="absolute right-2 top-1/2 -translate-y-1/2 clear-btn px-2 text-lg">&times;</button>
                </div>
            </div>
            <!-- Hero -->
            <div class="relative">
                <label id="lbl-hero" class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1"></label>
                <div class="relative">
                    <input type="text" id="hero" value="" placeholder="Default: hero musuh" class="w-full p-2.5 rounded ml-input text-sm">
                    <button onclick="clearField('hero')" class="absolute right-2 top-1/2 -translate-y-1/2 clear-btn px-2 text-lg">&times;</button>
                </div>
            </div>
            <!-- Message -->
            <div class="relative">
                <label id="lbl-msg" class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1"></label>
                <div class="relative">
                    <input type="text" id="msg" value="" placeholder="Default: hmmm" class="w-full p-2.5 rounded ml-input text-sm">
                    <button onclick="clearField('msg')" class="absolute right-2 top-1/2 -translate-y-1/2 clear-btn px-2 text-lg">&times;</button>
                </div>
            </div>
        </div>

        <!-- Clear All Button -->
        <div class="mt-4 flex justify-end">
            <button onclick="clearAllFields()" class="text-xs font-bold text-slate-400 hover:text-red-400 flex items-center transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                <span id="btn-clear-all">Hapus Semua</span>
            </button>
        </div>

        <!-- Result Box -->
        <div class="mt-8">
            <label id="lbl-res" class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1"></label>
            <div id="result" class="result-box p-4 rounded-lg text-sm text-green-400"></div>
            <button onclick="copyToClipboard()" id="btn-copy" class="w-full mt-4 py-3 rounded-lg font-bold ml-btn text-base shadow-lg uppercase tracking-wider">
                SALIN KODE
            </button>
        </div>

        <!-- Notes -->
        <div class="mt-8 space-y-2 text-[11px] text-slate-400 bg-slate-900/80 p-4 rounded-lg border border-slate-800 leading-relaxed">
            <p id="note-1"></p>
            <p id="note-2"></p>
            <p id="note-3"></p>
        </div>
    </div>

    <script>
        // --- KONFIGURASI DEFAULT ---
        let currentLang = 'id'; 

        const translations = {
            id: {
                sub: "Generator chat palsu untuk prank musuh",
                lblPrefix: "Karakter Awalan (Chat Kamu)",
                lblNick: "Nickname Musuh",
                lblHero: "Hero Musuh",
                lblMsg: "Isi Chat Musuh",
                lblRes: "Hasil (Copy Kode Ini):",
                btnClear: "Hapus Semua Kolom",
                btnCopy: "SALIN KODE",
                tagAll: "Semua",
                note1: "⚠️ Dibuat untuk bersenang-senang - gunakan dengan bijak.",
                note2: "⚠️ Pastikan paste di chat (All) saat pertandingan/match berlangsung.",
                note3: "⚠️ Jika ada peringatan chat tidak boleh lebih dari 60 karakter, maka ubah pengaturan bahasa Mobile Legends ke Bahasa Inggris.",
                copied: "BERHASIL DISALIN!"
            },
            en: {
                sub: "Fake chat generator for enemy pranks",
                lblPrefix: "Your Prefix Character",
                lblNick: "Enemy Nickname",
                lblHero: "Enemy Hero",
                lblMsg: "Enemy Message",
                lblRes: "Result (Copy This Code):",
                btnClear: "Clear All Fields",
                btnCopy: "COPY CODE",
                tagAll: "All",
                note1: "⚠️ Created for fun - use wisely.",
                note2: "⚠️ Make sure to paste in (All) chat during the match.",
                note3: "⚠️ If there is a 60-character limit warning, change your Mobile Legends language setting to English.",
                copied: "COPIED SUCCESSFULLY!"
            }
        };

        const inputIds = ['prefix', 'nick', 'hero', 'msg'];
        
        function updateUI() {
            const lang = translations[currentLang];
            document.getElementById('sub-title').innerText = lang.sub;
            document.getElementById('lbl-prefix').innerText = lang.lblPrefix;
            document.getElementById('lbl-nick').innerText = lang.lblNick;
            document.getElementById('lbl-hero').innerText = lang.lblHero;
            document.getElementById('lbl-msg').innerText = lang.lblMsg;
            document.getElementById('lbl-res').innerText = lang.lblRes;
            document.getElementById('btn-clear-all').innerText = lang.btnClear;
            document.getElementById('btn-copy').innerText = lang.btnCopy;
            document.getElementById('note-1').innerText = lang.note1;
            document.getElementById('note-2').innerText = lang.note2;
            document.getElementById('note-3').innerText = lang.note3;
            generateCode();
        }

        function generateCode() {
            // Mengambil value, jika kosong gunakan default (fallback)
            const prefix = document.getElementById('prefix').value || "p";
            const nick = document.getElementById('nick').value || "nickmusuh";
            const hero = document.getElementById('hero').value || "hero musuh";
            const msg = document.getElementById('msg').value || "hmmm";
            const allText = translations[currentLang].tagAll;

            // Format 2 Baris: p + enter + kode warna musuh
            const finalString = `${prefix}\n[FF0000FF][${allText}]${nick} (${hero}):[FFFFFFFF] ${msg}`;
            
            document.getElementById('result').innerText = finalString;
        }

        function clearField(id) {
            document.getElementById(id).value = "";
            generateCode();
            document.getElementById(id).focus();
        }

        function clearAllFields() {
            inputIds.forEach(id => document.getElementById(id).value = "");
            generateCode();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            updateUI();
        }

        function copyToClipboard() {
            const text = document.getElementById('result').innerText;
            const el = document.createElement('textarea');
            el.value = text;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const btn = document.getElementById('btn-copy');
            const originalText = translations[currentLang].btnCopy;
            btn.innerText = translations[currentLang].copied;
            btn.style.background = "linear-gradient(135deg, #059669, #047857)";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "";
            }, 2000);
        }

        inputIds.forEach(id => {
            document.getElementById(id).addEventListener('input', generateCode);
        });

        // Initialize UI on load
        updateUI();
    </script>
</body>
</html>
